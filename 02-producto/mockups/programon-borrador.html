<title>PROGRAMON Borrador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Lexend:wght@700;800&display=swap">
<style>
/* Layout: una app de celular a pantalla completa; en compu, una columna de 430px centrada.
   Una sola estética clara a propósito (es el mockup de una marca), con todos los colores en tokens. */
:root{
  --ground:#E4E0D5; --bg:#F3F0E8; --card:#FFFFFF; --line:#E2DDD2; --line2:#EFEBE2; --seg:#E7E2D7;
  --ink:#15211B; --muted:#56615B; --faint:#8A928D;
  --green:#155C3F; --green-soft:#E3ECE5; --green2:#3E7A5A;
  --blue:#1F4F80; --blue-soft:#E2ECF6;
  --purple:#5B3A80; --purple-soft:#EEE6F5;
  --saddle:#8A4510; --saddle-dot:#B5651D; --saddle-soft:#F6E7D8; --saddle-ink:#4F2607;
  --wa-bg:#EAE4D8;
  --grad:linear-gradient(145deg,#082419 0%,#0F3D2B 45%,#1C6B4B 100%);
  --grad-btn:linear-gradient(135deg,#0F3D2B 0%,#1F7A55 100%);
  --gold:#D9B565; --gold-ink:#7A5A14; --glass:rgba(255,255,255,.10); --glass-line:rgba(255,255,255,.16); --wa-mine:#D9EBD9; --scrim:rgba(21,33,27,.45);
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1C6B4B 0%,#082419 55%,#05140E 100%) fixed;color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.12)}}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:20px;padding-bottom:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.s{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.list{display:flex;flex-direction:column;padding:4px 14px}
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand{font-family:Lexend,Manrope,system-ui,sans-serif;font-weight:800;color:var(--green);letter-spacing:.01em;line-height:1}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.gap8{display:flex;flex-direction:column;gap:8px}
.mb{margin-bottom:20px}
.btn-plain{background:none;border:0;padding:0;cursor:pointer}
.btn-o{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--green);background:var(--card);color:var(--green);font-size:12.5px;font-weight:800;cursor:pointer}
.btn-g{height:48px;border-radius:12px;border:0;background:var(--green);color:#fff;font-size:14px;font-weight:800;cursor:pointer;width:100%}
.chip{height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--seg)}
.seg button{height:36px;border:0;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:#4A524D}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 8px 0 0;background:none;border:0;font-size:14px;font-weight:700;color:var(--green);cursor:pointer}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden}
.bar>div{height:100%;border-radius:999px}
.chk{width:26px;height:26px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid #C9C3B6;padding:0;cursor:pointer}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.done{color:var(--muted)!important;text-decoration:line-through}
.alert{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:999px;flex-shrink:0}
.ava{flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--display)}
nav.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;cursor:pointer;font-size:11px;font-weight:700;min-height:50px;color:#6B746F}
nav.tabs button.on{color:var(--green)}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.x{width:40px;height:40px;border-radius:999px;border:0;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.inp{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--card);width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700}
.hint{padding:11px 12px;border-radius:12px;background:var(--green-soft);font-size:12.5px;line-height:1.45;color:#20352A}
.tnum{font-variant-numeric:tabular-nums}
.wa-top{flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;padding-top:12px;padding-bottom:12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.wa-scr{flex:1;overflow-y:auto;background:var(--wa-bg);display:flex;flex-direction:column;gap:8px;padding-top:14px;padding-bottom:20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bub{max-width:82%;padding:8px 10px 6px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.06);font-size:14px;line-height:1.4;white-space:pre-line}
.bub.me{align-self:flex-end;background:var(--wa-mine);border-top-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--card);border-top-left-radius:4px}
.bub.media{width:82%}
.time{font-size:10.5px;color:#6B746F;text-align:right;margin-top:3px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* Dirección "cancha de noche": degradé verde profundo + acento dorado, solo en piezas clave */
.hero{background:var(--grad);color:#fff;border:0!important;box-shadow:0 12px 30px rgba(8,36,25,.28)}
.hero .muted,.hero .lbl{color:rgba(255,255,255,.72)!important}
.hero [style*="border-top"]{border-top-color:var(--glass-line)!important}
.hero svg{color:rgba(255,255,255,.75)!important}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:12px}
.btn-g{background:var(--grad-btn)!important;box-shadow:0 6px 16px rgba(21,92,63,.28)}
.chip.on{background:var(--grad-btn);border-color:transparent;color:#fff}
nav.tabs button{position:relative}
nav.tabs button.on::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 -2px 0 var(--gold)}
.gold{color:var(--gold)}
</style>
